<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chỉ Đường Google Maps Style</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="index1.css" />
</head>
<body>
  <div id="map"></div>
  <button class="location-btn" onclick="getLocation()">📍 Vị trí của tôi</button>
  
  <div class="container">
    <div class="panel">
      <h3>Chỉ Đường</h3>
      
      <input id="start" placeholder="Vị trí bắt đầu..." onkeypress="search(event, 'start')">
      <button onclick="search(null, 'start')">Tìm bắt đầu</button>
      
      <input id="end" placeholder="Vị trí kết thúc..." onkeypress="search(event, 'end')">
      <button onclick="search(null, 'end')">Tìm kết thúc</button>
      
      <hr class="divider">
      
      <div class="mode-control" hidden aria-hidden="true">
        <label for="mode">Phương tiện:</label>
        <select id="mode" onchange="changeMode()">
          <option value="driving">Xe hơi</option>
          <option value="cycling">Xe đạp</option>
          <option value="walking">Đi bộ</option>
        </select>
      </div>
      
      <hr class="divider">
      
      <input id="search" placeholder="Tìm kiếm địa chỉ..." onkeypress="search(event, 'general')">
      <button onclick="search(null, 'general')">Tìm kiếm</button>
      
      <hr class="divider">
      <div class="fuel-panel">
        <label>Trạm xăng gần đây</label>
        <div class="fuel-controls">
          <input id="fuelRadius" type="number" min="500" step="100" value="2000" aria-label="Bán kính (m)" />
          <button id="findFuelBtn" onclick="findFuelFromInput()">Tìm trạm xăng</button>
          <button id="clearFuelBtn" onclick="clearGasMarkers()">Xóa trạm</button>
        </div>
      </div>

      <div id="searchResults"></div>
    </div>
  </div>
  
  <div id="info" class="info-panel panel"></div>
  <div id="route" class="info-panel"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <script>
    // Khởi tạo bản đồ
    const map = L.map("map").setView([21.0285, 105.8542], 13);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);

    // Biến toàn cục
    let markers = { start: null, end: null, temp: null };
    let gasMarkers = []; // markers for nearby fuel stations
    let lastFuelCenter = null;
    const fuelIcon = L.icon({
      iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 36"><path fill="%23e74c3c" d="M14 0C8.48 0 4 4.48 4 10c0 7.5 9.5 16 10 16s10-8.5 10-16c0-5.52-4.48-10-10-10z"/><rect x="9" y="7" width="10" height="12" rx="2" fill="%23fff"/><rect x="12" y="10" width="4" height="6" fill="%23e74c3c"/></svg>',
      iconSize: [28, 36],
      iconAnchor: [14, 36],
      popupAnchor: [0, -36]
    });
    let router = null;
    let currentMode = 'driving';

    // Hàm tạo routing control
    function createRouter(mode) {
      if (router) router.remove();
      router = L.Routing.control({
        waypoints: [],
        router: L.Routing.osrmv1({
          serviceUrl: 'https://router.project-osrm.org/route/v1',
          profile: mode
        }),
        routeWhileDragging: false,
        showAlternatives: false,
        addWaypoints: false,
        createMarker: (i, wp) => markers[i === 0 ? 'start' : i === 1 ? 'end' : 'temp'] || L.marker(wp.latLng)
      }).addTo(map);

      router.on('routesfound', (e) => {
        if (!e.routes.length) return;
        const { totalDistance: d, totalTime: t } = e.routes[0].summary;
        const dist = d >= 1000 ? (d/1000).toFixed(2) + ' km' : Math.round(d) + ' m';
        const time = t >= 3600 ? Math.floor(t/3600) + 'h ' + Math.floor((t%3600)/60) + 'min' : Math.floor(t/60) + ' min';
        const modeText = { driving: 'Xe hơi', cycling: 'Xe đạp', walking: 'Đi bộ' }[mode];
        document.getElementById('route').innerHTML = `<b>${modeText} — Bắt đầu → Kết thúc</b><br>Khoảng cách: ${dist}<br>Thời gian: ${time}`;
        document.getElementById('route').style.display = 'block';
      });
    }

    // Tìm kiếm địa chỉ
    function search(event, type) {
      if (event && event.key !== 'Enter') return;
      
      const inputs = { start: 'start', end: 'end', general: 'search' };
      const query = document.getElementById(inputs[type]).value.trim();
      if (!query) return alert('Vui lòng nhập địa chỉ!');

      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=10`;
      
      fetch(url)
        .then(r => r.json())
        .then(data => {
          const div = document.getElementById('searchResults');
          div.innerHTML = '';
          if (data.length === 0) return alert('Không tìm thấy!');
          
          div.style.display = 'block';
          data.forEach(item => {
            const el = document.createElement('div');
            el.className = 'result-item';
            el.innerHTML = `<strong>${item.display_name || item.name}</strong>`;
            el.onclick = () => selectLocation(item, type);
            div.appendChild(el);
          });
        })
        .catch(err => alert('Lỗi: ' + err.message));
    }

    // Chọn địa điểm
    function selectLocation(loc, type) {
      const lat = parseFloat(loc.lat), lng = parseFloat(loc.lon);
      const name = loc.display_name || loc.name;
      
      if (type === 'general') {
        if (markers.temp) map.removeLayer(markers.temp);
        markers.temp = L.marker([lat, lng]).addTo(map).bindPopup(name).openPopup();
      } else {
        if (markers[type]) map.removeLayer(markers[type]);
        markers[type] = L.marker([lat, lng]).addTo(map).bindPopup(`<b>${type === 'start' ? 'Bắt đầu' : 'Kết thúc'}</b><br>${name}`).openPopup();
        updateRoute();
      }
      
      map.setView([lat, lng], 13);
      document.getElementById('searchResults').style.display = 'none';
    }

    // Cập nhật tuyến
    function updateRoute() {
      if (!markers.start || !markers.end) {
        if (router) router.setWaypoints([]);
        document.getElementById('route').style.display = 'none';
        return;
      }
      const s = markers.start.getLatLng(), e = markers.end.getLatLng();
      router.setWaypoints([L.latLng(s.lat, s.lng), L.latLng(e.lat, e.lng)]);
    }

    // Đổi phương tiện
    function changeMode() {
      currentMode = document.getElementById('mode').value;
      createRouter(currentMode);
      updateRoute();
    }

    // Lấy vị trí hiện tại
    function getLocation() {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '⏳...';
      
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude: lat, longitude: lng, accuracy: acc } = pos.coords;
          if (markers.temp) map.removeLayer(markers.temp);
          markers.temp = L.marker([lat, lng]).addTo(map).bindPopup(`<b>Vị trí hiện tại</b><br>Độ chính xác: ${acc.toFixed(0)}m`).openPopup();
          map.setView([lat, lng], 15);
          getAddress(lat, lng);

          // tìm các trạm xăng gần nhất (mặc định bán kính 2km)
          findNearbyFuelStations(lat, lng, 2000);

          btn.disabled = false;
          btn.textContent = '📍 Vị trí của tôi';
        },
        (err) => {
          alert('Lỗi: ' + err.message);
          btn.disabled = false;
          btn.textContent = '📍 Vị trí của tôi';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // Lấy địa chỉ từ tọa độ
    function getAddress(lat, lng) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
        .then(r => r.json())
        .then(data => {
          const addr = data.address?.road ? `${data.address.road}, ${data.address.city || data.address.town || ''}` : data.name || 'N/A';
          const info = document.getElementById('info');
          info.innerHTML = `<h4>Thông tin vị trí</h4><p><strong>Vĩ độ:</strong> ${lat.toFixed(6)}</p><p><strong>Kinh độ:</strong> ${lng.toFixed(6)}</p><p><strong>Địa chỉ:</strong> ${addr}</p>`;
          info.style.display = 'block';
        });
    }

    // Tìm trạm xăng gần vị trí (sử dụng Overpass API)
    function clearGasMarkers() {
      gasMarkers.forEach(m => map.removeLayer(m));
      gasMarkers = [];
      const div = document.getElementById('searchResults');
      div.innerHTML = '';
      div.style.display = 'none';
    }

    function findFuelFromInput() {
      const val = parseInt(document.getElementById('fuelRadius').value) || 2000;
      let center;
      if (markers.temp) center = markers.temp.getLatLng();
      else center = map.getCenter();
      findNearbyFuelStations(center.lat, center.lng, val);
    }

    function findNearbyFuelStations(lat, lng, radius = 2000) {
      clearGasMarkers();
      lastFuelCenter = { lat, lng };
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = '<div class="result-item"><strong>Đang tìm trạm xăng gần đây...</strong></div>';
      resultsDiv.style.display = 'block';

      const query = `
        [out:json][timeout:25];
        (
          node["amenity"="fuel"](around:${radius},${lat},${lng});
          way["amenity"="fuel"](around:${radius},${lat},${lng});
          relation["amenity"="fuel"](around:${radius},${lat},${lng});
        );
        out center 50;
      `;

      fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: query,
        headers: { 'Content-Type': 'text/plain' }
      })
      .then(r => r.json())
      .then(data => {
        const elems = data.elements || [];
        if (!elems.length) {
          resultsDiv.innerHTML = '<div class="result-item"><strong>Không tìm thấy trạm xăng trong bán kính.</strong></div>';
          return;
        }

        const stations = elems.map(el => {
          const latLng = el.type === 'node' ? { lat: el.lat, lon: el.lon } : (el.center || {});
          return {
            id: el.id,
            name: el.tags?.name || 'Trạm xăng',
            brand: el.tags?.brand || '',
            lat: latLng.lat,
            lon: latLng.lon,
            tags: el.tags || {}
          };
        }).filter(s => s.lat && s.lon);

        // sort by distance to center and limit to 20
        if (lastFuelCenter) {
          stations.sort((a,b) => {
            const da = map.distance([a.lat,a.lon],[lastFuelCenter.lat,lastFuelCenter.lng]);
            const db = map.distance([b.lat,b.lon],[lastFuelCenter.lat,lastFuelCenter.lng]);
            return da - db;
          });
        }
        renderGasResults(stations.slice(0,20));
      })
      .catch(err => {
        resultsDiv.innerHTML = `<div class="result-item"><strong>Lỗi khi tìm: ${err.message}</strong></div>`;
      });
    }

    function renderGasResults(stations) {
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = '';

      stations.forEach(st => {
        const marker = L.marker([st.lat, st.lon], { icon: fuelIcon }).addTo(map).bindPopup(`<b>${st.name}</b><br>${st.brand || ''}`);
        gasMarkers.push(marker);

        let distStr = '';
        if (lastFuelCenter) {
          const dist = map.distance([st.lat, st.lon], [lastFuelCenter.lat, lastFuelCenter.lng]);
          distStr = dist >= 1000 ? (dist/1000).toFixed(2) + ' km' : Math.round(dist) + ' m';
        }

        const el = document.createElement('div');
        el.className = 'result-item';

        const title = document.createElement('strong');
        title.textContent = st.name;

        const meta = document.createElement('div');
        meta.style = 'font-size:12px;color:#666';
        meta.innerHTML = `${st.brand || ''} ${distStr ? '• ' + distStr : ''}`;

        const actions = document.createElement('div');
        actions.className = 'result-actions';

        const btnStart = document.createElement('button');
        btnStart.className = 'small-btn set-start';
        btnStart.textContent = 'Đặt làm bắt đầu';
        btnStart.onclick = (e) => { e.stopPropagation(); setAsStart(st.lat, st.lon, st.name); };

        const btnEnd = document.createElement('button');
        btnEnd.className = 'small-btn set-end';
        btnEnd.textContent = 'Đặt làm kết thúc';
        btnEnd.onclick = (e) => { e.stopPropagation(); setAsEnd(st.lat, st.lon, st.name); };

        actions.appendChild(btnStart);
        actions.appendChild(btnEnd);

        el.appendChild(title);
        el.appendChild(meta);
        el.appendChild(actions);

        el.onclick = () => { map.setView([st.lat, st.lon], 16); marker.openPopup(); };
        resultsDiv.appendChild(el);
      });

      resultsDiv.style.display = 'block';
    }

    function setAsStart(lat, lon, name) {
      if (markers.start) map.removeLayer(markers.start);
      markers.start = L.marker([lat, lon]).addTo(map).bindPopup(`<b>Bắt đầu</b><br>${name}`).openPopup();
      document.getElementById('start').value = name;
      updateRoute();
      map.setView([lat, lon], 14);
    }

    function setAsEnd(lat, lon, name) {
      if (markers.end) map.removeLayer(markers.end);
      markers.end = L.marker([lat, lon]).addTo(map).bindPopup(`<b>Kết thúc</b><br>${name}`).openPopup();
      document.getElementById('end').value = name;
      updateRoute();
      map.setView([lat, lon], 14);
    }

    // Click trên bản đồ
    map.on('click', (e) => {
      const { lat, lng } = e.latlng;
      if (markers.temp) map.removeLayer(markers.temp);
      markers.temp = L.marker([lat, lng]).addTo(map).bindPopup(`Vĩ độ: ${lat.toFixed(6)}<br>Kinh độ: ${lng.toFixed(6)}`).openPopup();
      getAddress(lat, lng);
    });

    // Khởi tạo router
    createRouter(currentMode);
  </script>
</body>
</html>
